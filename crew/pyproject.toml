[project]
name = "cli-crew"
version = "0.1.1"
description = "Delegate tasks from a main AI CLI to non-interactive worker CLIs (codex, agy, claude, cursor, copilot) with verification and records."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
terminal = ["pywinpty>=3.0.3,<4; sys_platform == 'win32'"]

[project.scripts]
crew = "crew.cli:main"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crew = ["viewer/*.html", "viewer/*.css", "viewer/*.js", "viewer/vendor/*"]

